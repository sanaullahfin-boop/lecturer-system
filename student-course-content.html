<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Content · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="content"></aside>

  <main class="main">
    <div class="topbar">
      <div><h1>Course Content</h1><div class="today" id="item-count"></div></div>
      <div class="user-chip">
        <div><div id="student-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="student-initial">·</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="files">My Course Files</button>
      <button class="tab-btn" data-tab="ebooks">Ebook Library</button>
    </div>
    <div id="tab-files">
      <div class="toolbar"><input type="text" class="search-input" id="file-search" placeholder="Search files…"></div>
      <div class="table-panel">
        <table class="data-table">
          <thead><tr><th>File</th><th>Course</th><th>Category</th><th>Added</th></tr></thead>
          <tbody id="files-body"><tr><td colspan="4"><div class="empty-state"><span class="loading-dot"></span> Loading…</div></td></tr></tbody>
        </table>
      </div>
    </div>
    <div id="tab-ebooks" class="hidden">
      <div class="toolbar"><input type="text" class="search-input" id="ebook-search" placeholder="Search title, author, subject…"></div>
      <div class="table-panel">
        <table class="data-table">
          <thead><tr><th>Title</th><th>Author</th><th>Subject</th></tr></thead>
          <tbody id="ebooks-body"><tr><td colspan="3"><div class="empty-state"><span class="loading-dot"></span> Loading…</div></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/grading.js"></script>
<script src="js/files.js"></script>
<script src="js/student-course-content.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
