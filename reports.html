<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" data-role="admin" data-active="reports"></aside>

  <main class="main">
    <div class="topbar">
      <div><h1>Reports</h1><div class="today" id="page-sub">Pick a report, set filters, preview it — then download Excel or print / save as PDF</div></div>
      <div class="user-chip">
        <div><div id="admin-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="admin-initial">·</div>
      </div>
    </div>

    <div class="report-types" id="report-types"></div>

    <div class="panel no-print" id="report-filters">
      <div class="filter-row" style="margin-bottom:6px;">
        <div class="field" data-f="term"><label>Term</label><select id="r-term"><option value="">All terms</option></select></div>
        <div class="field grow" data-f="course"><label>Course</label><select id="r-course"></select></div>
        <div class="field grow" data-f="student"><label>Student</label><input type="text" id="r-student" list="r-student-list" placeholder="Type roll number or name"><datalist id="r-student-list"></datalist></div>
        <div class="field" data-f="itemtype"><label>Assessment type</label>
          <select id="r-itemtype"><option value="">All types</option><option value="quiz">Quizzes</option><option value="assignment">Assignments</option><option value="presentation">Presentations</option><option value="task">Tasks</option><option value="exam">Internal Exams</option></select></div>
        <div class="field" data-f="from"><label>From</label><input type="date" id="r-from"></div>
        <div class="field" data-f="to"><label>To</label><input type="date" id="r-to"></div>
        <div class="field" data-f="inactive"><label class="check-row"><input type="checkbox" id="r-inactive"> Include inactive students</label></div>
      </div>
      <div class="gap-row">
        <button class="btn btn-primary-sm" id="btn-generate">Generate Report</button>
        <span class="muted small" id="r-hint"></span>
      </div>
      <div class="form-msg" id="report-msg"></div>
    </div>

    <div class="report-output hidden" id="report-output">
      <div class="report-head">
        <div><h2 id="out-title"></h2><div class="sub" id="out-sub"></div></div>
        <div class="gap-row no-print">
          <button class="btn btn-outline" id="btn-out-excel">Download Excel</button>
          <button class="btn btn-outline" id="btn-out-csv">CSV</button>
          <button class="btn btn-primary-sm" id="btn-out-print">Print / Save PDF</button>
        </div>
      </div>
      <div class="print-only" id="out-print-head"></div>
      <div id="out-body"></div>
    </div>
  </main>
</div>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/grading.js"></script>
<script src="js/reports.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
