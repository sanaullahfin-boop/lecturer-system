<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="seal">SC</div><div class="brand-name">Sanaullah's Classroom<small>Student Portal</small></div></div>
    <div class="nav-group-label">My Records</div>
    <a class="nav-link" href="student-dashboard.html">Dashboard</a>
    <a class="nav-link active" href="student-attendance.html">Attendance</a>
    <a class="nav-link" href="student-marks.html">Marks</a>
    <a class="nav-link" href="student-assignments.html">Assignments</a>
    <a class="nav-link" href="student-presentations.html">Presentations</a>
    <a class="nav-link" href="student-course-content.html">Course Content</a>
    <a class="nav-link" href="student-announcements.html">Announcements</a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1>My Attendance</h1><div class="today" id="today-label"></div></div>
      <div class="user-chip">
        <div><div id="student-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="student-initial">·</div>
      </div>
    </div>

    <div class="stat-grid" id="course-stats"></div>

    <h3 style="font-size:15px; margin:22px 0 12px;">Day-by-Day Log</h3>
    <div class="table-panel">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Course</th><th>Status</th></tr></thead>
        <tbody id="log-body"><tr><td colspan="3"><div class="empty-state"><span class="loading-dot"></span> Loading…</div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/student-attendance.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
