<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="attendance"></aside>

  <main class="main">
    <div class="topbar">
      <div><h1>My Attendance</h1><div class="today" id="page-sub"></div></div>
      <div class="user-chip">
        <div><div id="student-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="student-initial">·</div>
      </div>
    </div>

    <div class="stat-grid" id="course-stats"></div>
    <div class="panel-grid" style="margin-bottom:20px;">
      <div class="panel">
        <h3>Request Leave</h3>
        <div class="filter-row" style="margin-bottom:8px;">
          <div class="field grow"><label>Course</label><select id="lv-course"><option value="">All my courses</option></select></div>
          <div class="field"><label>From</label><input type="date" id="lv-from"></div>
          <div class="field"><label>To</label><input type="date" id="lv-to"></div>
        </div>
        <div class="field"><label>Reason</label><textarea id="lv-reason" rows="2" maxlength="600" placeholder="e.g. Medical — fever, certificate attached in WhatsApp"></textarea></div>
        <button class="btn btn-primary-sm" id="lv-send">Send Request</button>
        <div class="form-msg" id="lv-msg"></div>
      </div>
      <div class="panel">
        <h3>My Leave Requests</h3>
        <div id="lv-list"><div class="empty-state">No requests yet.</div></div>
      </div>
    </div>
    <div class="toolbar"><h3 style="font-size:15px;">Day-by-Day Log</h3><select id="log-course"><option value="">All courses</option></select></div>
    <div class="table-panel">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Course</th><th>Status</th></tr></thead>
        <tbody id="log-body"><tr><td colspan="3"><div class="empty-state"><span class="loading-dot"></span> Loading…</div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/grading.js"></script>
<script src="js/student-attendance.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
