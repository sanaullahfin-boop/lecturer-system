<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" data-role="admin" data-active="courses"></aside>

  <main class="main">
    <div class="topbar">
      <div><h1>Courses</h1><div class="today" id="course-count"></div></div>
      <div class="user-chip">
        <div><div id="admin-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="admin-initial">·</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="gap-row" style="flex:1;">
        <input type="text" class="search-input" id="search-input" placeholder="Search title, code, teacher, program…">
        <select id="filter-term"><option value="">All terms</option></select>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-outline" id="btn-export">Export Excel</button>
        <button class="btn btn-outline" id="btn-import">Import Excel</button>
        <input type="file" id="import-file" accept=".xlsx,.xls" class="hidden">
        <button class="btn btn-primary-sm" id="btn-add">+ Add Course</button>
      </div>
    </div>
    <div id="import-progress" class="form-msg info" style="display:none;"></div>
    <div class="table-panel">
      <table class="data-table">
        <thead><tr><th>Code</th><th>Subject</th><th>Class</th><th>Term</th><th class="c">Cr. Hrs</th><th class="c">Sem</th><th>Sec</th><th class="c">Students</th><th>Plan</th><th></th></tr></thead>
        <tbody id="table-body"><tr><td colspan="10"><div class="empty-state"><span class="loading-dot"></span> Loading courses…</div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Add Course</h2>
    <form id="course-form">
      <input type="hidden" id="original-code">
      <div class="form-grid">
        <div class="field"><label>Course Code *</label><input type="text" id="f-code" required placeholder="e.g. FIN301"></div>
        <div class="field"><label>Term</label><input type="text" id="f-term" placeholder="e.g. Fall 2026" list="term-list"><datalist id="term-list"></datalist></div>
        <div class="field full"><label>Subject / Title *</label><input type="text" id="f-title" required placeholder="e.g. Financial Management"></div>
        <div class="field"><label>Class / Program *</label><input type="text" id="f-class" required placeholder="e.g. BS Finance"></div>
        <div class="field"><label>Credit Hours *</label><input type="number" id="f-credits" required min="1" max="6"></div>
        <div class="field"><label>Semester *</label><input type="number" id="f-semester" required min="1" max="12"></div>
        <div class="field"><label>Section</label><input type="text" id="f-section" placeholder="e.g. A"></div>
        <div class="field full"><label>Teacher</label><input type="text" id="f-teacher" placeholder="e.g. Dr. Sanaullah"></div>
        <div class="field full"><label>Reference Books (separate with ;)</label><input type="text" id="f-books" placeholder="e.g. Brigham &amp; Houston; Ross et al."></div>
        <div class="field full"><label>Course Outline (summary or link)</label><input type="text" id="f-outline"></div>
      </div>
      <div class="form-msg" id="form-msg"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary-sm" id="btn-save">Save Course</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="delete-modal">
  <div class="modal">
    <h2>Delete Course</h2>
    <p id="delete-text" style="font-size:13.5px;line-height:1.6;"></p>
    <label class="check-row" style="margin:10px 0;"><input type="checkbox" id="delete-cascade" checked> Also delete this course's attendance, assignments/quizzes/exams and their marks, course plan, files list and gradebook adjustments</label>
    <p class="help">Tip: download a backup first if you might need this data later. Students stay; only the course code is removed from their enrolment.</p>
    <div class="form-msg" id="delete-msg"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="delete-cancel">Cancel</button>
      <button type="button" class="btn btn-primary-sm" id="delete-confirm" style="background:var(--danger);">Delete</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/grading.js"></script>
<script src="js/courses.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
