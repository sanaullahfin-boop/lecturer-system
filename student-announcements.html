<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="seal">SC</div><div class="brand-name">Sanaullah's Classroom<small>Student Portal</small></div></div>
    <div class="nav-group-label">My Records</div>
    <a class="nav-link" href="student-dashboard.html">Dashboard</a>
    <a class="nav-link" href="student-attendance.html">Attendance</a>
    <a class="nav-link" href="student-marks.html">Marks</a>
    <a class="nav-link" href="student-assignments.html">Assignments</a>
    <a class="nav-link" href="student-presentations.html">Presentations</a>
    <a class="nav-link" href="student-course-content.html">Course Content</a>
    <a class="nav-link active" href="student-announcements.html">Announcements</a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1>Announcements</h1><div class="today" id="item-count">—</div></div>
      <div class="user-chip">
        <div><div id="student-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="student-initial">·</div>
      </div>
    </div>

    <div class="panel">
      <div id="list"><div class="empty-state"><span class="loading-dot"></span> Loading…</div></div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('logout-btn').addEventListener('click', logout);
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  requireStudent(async (user, studentDoc) => {
    const d = studentDoc.data();
    document.getElementById('student-name').textContent = d.name || user.email;
    document.getElementById('student-initial').textContent = (d.name || '?').charAt(0).toUpperCase();

    const list = document.getElementById('list');
    try {
      const snap = await db.collection('announcements').orderBy('postedAt', 'desc').get();
      const enrolledCourses = d.course || [];
      const mine = snap.docs
        .map(doc => doc.data())
        .filter(a => a.target === 'all' || enrolledCourses.includes(a.target));

      document.getElementById('item-count').textContent = `${mine.length} announcement${mine.length === 1 ? '' : 's'}`;

      if (mine.length === 0) {
        list.innerHTML = `<div class="empty-state">Nothing posted yet.</div>`;
        return;
      }
      list.innerHTML = mine.map(a => `
        <div class="list-row">
          <div>
            <div class="row-title">${escapeHtml(a.title)}</div>
            <div class="row-meta">${escapeHtml(a.body)}</div>
          </div>
          <div class="row-meta mono">${new Date(a.postedAt).toLocaleDateString()}</div>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = `<div class="empty-state">Could not load announcements: ${escapeHtml(e.message)}</div>`;
    }
  });
</script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
