<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments · Sanaullah's Classroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" data-role="admin" data-active="assignments"></aside>

  <main class="main">
    <div class="topbar">
      <div><h1>Assignments</h1><div class="today" id="page-sub"></div></div>
      <div class="user-chip">
        <div><div id="admin-name">Loading…</div><span class="logout-link" id="logout-btn">Sign out</span></div>
        <div class="avatar" id="admin-initial">·</div>
      </div>
    </div>

    
    <div class="toolbar">
      <div class="gap-row">
        <select id="gi-filter-course"><option value="">All courses</option></select>
        <label class="check-row"><input type="checkbox" id="gi-all-terms"> Show all terms</label>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-primary-sm" id="gi-add">+ New Assignment</button>
      </div>
    </div>
    <div class="table-panel">
      <table class="data-table">
        <thead><tr><th>Title</th><th>Course</th><th>Date</th><th class="r">Total</th><th>Assigned To</th><th>Gradebook</th><th></th></tr></thead>
        <tbody id="gi-body"><tr><td colspan="7"><div class="empty-state"><span class="loading-dot"></span> Loading…</div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add/Edit item -->
<div class="modal-backdrop" id="gi-modal">
  <div class="modal">
    <h2 id="gi-modal-title">New</h2>
    <form id="gi-form">
      <input type="hidden" id="gi-id">
      <div class="form-grid">
        <div class="field full" id="gi-title-wrap"><label id="gi-title-label">Title *</label><input type="text" id="gi-title"></div>
        <div class="field full hidden" id="gi-exam-wrap"><label>Exam *</label>
          <select id="gi-exam-title"></select>
        </div>
        <div class="field"><label>Course *</label><select id="gi-course"></select></div>
        <div class="field"><label id="gi-date-label">Date *</label><input type="date" id="gi-due"></div>
        <div class="field"><label id="gi-total-label">Total Marks *</label><input type="number" id="gi-total" min="0" step="any"></div>
        <div class="field"><label>Gradebook</label>
          <label class="check-row" style="margin-top:10px;"><input type="checkbox" id="gi-count" checked> Count this in the gradebook</label>
        </div>
        <div class="field full hidden" id="gi-desc-wrap"><label>Description</label><textarea id="gi-desc" rows="2"></textarea></div>
        <div class="field full hidden" id="gi-instr-wrap"><label>Instructions</label><textarea id="gi-instructions" rows="2"></textarea></div>
        <div class="field full hidden" id="gi-attach-wrap"><label>Attachment link (optional)</label><input type="text" id="gi-attachment" placeholder="Google Drive or any https:// link"></div>
        <div class="field full hidden" id="gi-sub-wrap"><label class="check-row"><input type="checkbox" id="gi-allow-sub"> Students submit their work online (they paste a Google Drive / any https link before the due date)</label></div>
        <div class="field full">
          <label>Assign To</label>
          <div class="radio-row">
            <label><input type="radio" name="gi-mode" value="all" checked> Entire class</label>
            <label><input type="radio" name="gi-mode" value="selected"> Selected students</label>
          </div>
          <div class="assignee-picker hidden" id="gi-picker"></div>
        </div>
      </div>
      <div class="form-msg" id="gi-form-msg"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="gi-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary-sm" id="gi-save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Marks grid -->
<div class="modal-backdrop" id="gi-marks-modal">
  <div class="modal wide">
    <h2 id="gi-marks-title">Enter Marks</h2>
    <div class="gap-row" style="margin-bottom:12px;">
      <button type="button" class="btn btn-outline" id="gi-template" style="font-size:12px;">Download Template</button>
      <button type="button" class="btn btn-outline" id="gi-import" style="font-size:12px;">Upload Filled Marks</button>
      <input type="file" id="gi-import-file" accept=".xlsx,.xls" class="hidden">
      <span class="muted small">Fill all blanks with</span>
      <input type="number" id="gi-fill-value" class="marks-input" step="any">
      <button type="button" class="btn btn-outline" id="gi-fill" style="font-size:12px;">Fill</button>
    </div>
    <div class="kpi-inline" id="gi-marks-stats" style="margin-bottom:10px;"></div>
    <div class="table-panel" style="box-shadow:none;border:1px solid var(--hairline);margin-bottom:14px;max-height:55vh;overflow:auto;">
      <table class="data-table compact">
        <thead id="gi-marks-head"></thead>
        <tbody id="gi-marks-body"></tbody>
      </table>
    </div>
    <div class="form-msg" id="gi-marks-msg"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="gi-marks-close">Close</button>
      <button type="button" class="btn btn-primary-sm" id="gi-marks-save">Save Marks</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/firebase-keys.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/grading.js"></script>
<script src="js/grade-items.js"></script>
<script src="js/assignments.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
